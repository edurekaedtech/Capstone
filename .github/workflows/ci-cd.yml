name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code with Flake8
        run: |
          pip install flake8
          flake8 main.py --max-line-length=79 --count --statistics
        continue-on-error: true

      - name: Run basic tests
        run: |
          python -m unittest discover tests 2>/dev/null || echo "No tests found, skipping."
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t capstone-ai-pipeline .

      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main'
        run: echo "Add Docker push step here if using a registry."
