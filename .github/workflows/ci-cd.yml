name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for testing
        run: |
          echo "OPENAI_API_KEY=test_key_for_ci" > .env
          echo "SECRET_KEY=test_secret_key_for_ci" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env

      - name: Verify required files
        run: |
          echo "Checking required files for deployment..."
          files=("main.py" "auth.py" "data.py" "retrieval.py" "models.py" "analytics.py" "requirements.txt" "Dockerfile" "static/index.html")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file found"
            else
              echo "✗ $file missing"
              exit 1
            fi
          done
          echo "All required files present!"

      - name: Lint code with Flake8
        run: |
          pip install flake8
          flake8 main.py --max-line-length=79 --count --statistics
        continue-on-error: true

      - name: Run basic tests
        run: |
          python -m unittest discover tests 2>/dev/null || echo "No tests found, skipping."
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t capstone-ai-pipeline .

      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main'
        run: echo "Add Docker push step here if using a registry."
